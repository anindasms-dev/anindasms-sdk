[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anindasms"
version = "1.0.0"
description = "Official Python SDK for the AnindaSMS API (SMS Verification, Rental, Proxy, eSIM, Temporary Mail)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://anindasms.com/api"
Source = "https://github.com/anindasms-dev/anindasms-sdk"

[tool.setuptools]
packages = ["anindasms"]
